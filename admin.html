<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Panel de administración — Uruguayan Jerky</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --wood:#1b1410; --wood-2:#241a12;
    --parchment:#f3ead9; --parchment-2:#eadfc7;
    --ink:#241a12; --gold:#b98a44; --gold-bright:#d3a862;
    --rust:#8c3f26; --hairline-light:#d9c7a8; --hairline-dark:#3a2c1e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--wood);color:var(--parchment);
    font-family:'Inter',sans-serif;min-height:100vh;
  }
  h1,h2,h3{font-family:'Fraunces',serif;margin:0;}
  .wrap{max-width:920px;margin:0 auto;padding:40px 24px 80px;}

  /* LOGIN */
  #loginScreen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .login-card{
    background:var(--parchment);color:var(--ink);
    border-radius:8px;padding:40px 36px;max-width:380px;width:100%;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.6);
  }
  .login-card h1{font-size:1.6rem;margin-bottom:8px;}
  .login-card p{color:#6a5a44;font-size:.92rem;margin-bottom:24px;}
  .login-card input{
    width:100%;padding:12px 14px;border:1px solid var(--hairline-light);
    border-radius:4px;font-size:1rem;margin-bottom:14px;font-family:'Inter',sans-serif;
  }
  .login-card button{
    width:100%;background:var(--wood);color:var(--parchment);border:none;
    padding:13px;border-radius:4px;font-weight:700;font-size:.95rem;cursor:pointer;
  }
  .login-card button:hover{background:var(--rust);}
  .login-error{color:#b04a4a;font-size:.85rem;margin-top:10px;min-height:1.2em;}

  /* DASHBOARD */
  #dashboard{display:none;}
  header.admin-head{
    display:flex;justify-content:space-between;align-items:center;
    padding-bottom:24px;margin-bottom:32px;border-bottom:1px solid var(--hairline-dark);
  }
  header.admin-head h1{font-size:1.5rem;}
  header.admin-head .sub{font-size:.82rem;color:var(--parchment-2);margin-top:4px;}
  #logoutBtn{
    background:transparent;border:1px solid var(--hairline-light);color:var(--parchment);
    padding:9px 16px;border-radius:4px;cursor:pointer;font-size:.85rem;
  }
  #logoutBtn:hover{background:var(--hairline-light);color:var(--ink);}

  .tabs{display:flex;gap:10px;margin-bottom:28px;}
  .tab-btn{
    background:transparent;border:1px solid var(--hairline-light);color:var(--parchment-2);
    padding:10px 20px;border-radius:20px;cursor:pointer;font-family:'Fraunces',serif;
    font-style:italic;font-size:.95rem;
  }
  .tab-btn.active{background:var(--gold);color:var(--wood);border-color:var(--gold);font-style:normal;font-weight:600;}
  .panel{display:none;}
  .panel.active{display:block;}

  .add-btn-main{
    background:var(--gold);color:var(--wood);border:none;
    padding:12px 20px;border-radius:4px;font-weight:700;cursor:pointer;font-size:.9rem;
    margin-bottom:22px;
  }
  .add-btn-main:hover{background:var(--gold-bright);}

  .item-card{
    background:var(--parchment);color:var(--ink);border-radius:6px;
    padding:16px 18px;margin-bottom:12px;display:flex;gap:14px;align-items:center;
  }
  .item-card img{width:56px;height:56px;object-fit:cover;border-radius:4px;background:#ddd;flex-shrink:0;}
  .item-card .info{flex:1;min-width:0;}
  .item-card .info .name{font-weight:700;font-size:1rem;}
  .item-card .info .meta{font-size:.82rem;color:#6a5a44;margin-top:2px;}
  .item-card .actions{display:flex;gap:8px;flex-shrink:0;}
  .item-card .actions button{
    border:none;border-radius:4px;padding:8px 14px;font-size:.82rem;cursor:pointer;font-weight:600;
  }
  .btn-edit{background:var(--wood);color:var(--parchment);}
  .btn-edit:hover{background:var(--rust);}
  .btn-delete{background:transparent;color:#b04a4a;border:1px solid #b04a4a !important;}
  .btn-delete:hover{background:#b04a4a;color:#fff;}

  .empty-state{color:var(--parchment-2);font-size:.92rem;padding:30px 0;text-align:center;}

  /* MODAL FORM */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(15,11,8,.7);
    display:none;align-items:center;justify-content:center;z-index:100;padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{
    background:var(--parchment);color:var(--ink);border-radius:8px;
    padding:30px;max-width:460px;width:100%;max-height:90vh;overflow-y:auto;
  }
  .modal-box h2{font-size:1.3rem;margin-bottom:20px;}
  .form-field{margin-bottom:16px;}
  .form-field label{display:block;font-size:.82rem;color:#6a5a44;margin-bottom:5px;font-weight:600;}
  .form-field input[type=text], .form-field input[type=number], .form-field textarea{
    width:100%;padding:10px 12px;border:1px solid var(--hairline-light);border-radius:4px;
    font-family:'Inter',sans-serif;font-size:.92rem;
  }
  .form-field textarea{resize:vertical;min-height:60px;}
  .form-field.checkbox{display:flex;align-items:center;gap:8px;}
  .form-field.checkbox input{width:auto;}
  .form-actions{display:flex;gap:10px;margin-top:24px;}
  .form-actions button{
    flex:1;padding:12px;border-radius:4px;border:none;font-weight:700;font-size:.9rem;cursor:pointer;
  }
  .btn-save{background:var(--wood);color:var(--parchment);}
  .btn-save:hover{background:var(--rust);}
  .btn-cancel{background:transparent;border:1px solid var(--hairline-light) !important;color:var(--ink);}
  .img-preview{width:80px;height:80px;object-fit:cover;border-radius:4px;margin-top:8px;display:none;background:#ddd;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--gold);color:var(--wood);padding:12px 22px;border-radius:24px;
    font-weight:700;font-size:.88rem;opacity:0;transition:opacity .25s ease, transform .25s ease;
    pointer-events:none;z-index:200;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .content-section{
    background:rgba(243,234,217,.05);border:1px solid var(--hairline-dark);
    border-radius:8px;padding:22px;margin-bottom:22px;
  }
  .content-section h3{font-size:1.1rem;margin-bottom:16px;color:var(--gold-bright);}
  .content-section .form-field label{color:var(--parchment-2);}
  .content-section .form-field input, .content-section .form-field textarea{
    background:#fff;
  }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <h1>Panel de administración</h1>
    <p>Uruguayan Jerky — acceso privado</p>
    <input type="password" id="passwordInput" placeholder="Contraseña" autocomplete="current-password">
    <button id="loginBtn">Entrar</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div id="dashboard">
  <div class="wrap">
    <header class="admin-head">
      <div>
        <h1>Uruguayan Jerky</h1>
        <div class="sub">Panel de administración</div>
      </div>
      <button id="logoutBtn">Cerrar sesión</button>
    </header>

    <div class="tabs">
      <button class="tab-btn active" data-tab="productos">Productos</button>
      <button class="tab-btn" data-tab="descuentos">Códigos de descuento</button>
      <button class="tab-btn" data-tab="resenas">Reseñas</button>
      <button class="tab-btn" data-tab="contenido">Contenido del sitio</button>
    </div>

    <div class="panel active" id="panel-productos">
      <button class="add-btn-main" id="addProductBtn">+ Agregar producto</button>
      <div id="productList"></div>
    </div>

    <div class="panel" id="panel-descuentos">
      <button class="add-btn-main" id="addDiscountBtn">+ Agregar código</button>
      <div id="discountList"></div>
    </div>

    <div class="panel" id="panel-resenas">
      <div id="reviewsAdminList"></div>
    </div>

    <div class="panel" id="panel-contenido">
      <div class="content-section">
        <h3>Textos de la web</h3>
        <div class="form-field">
          <label>Texto principal (debajo del logo, en la portada)</label>
          <textarea id="ctHeroLead"></textarea>
        </div>
        <div class="form-field">
          <label>Título de la sección "Nutrición"</label>
          <input type="text" id="ctNutritionTitle">
        </div>
        <div class="form-field">
          <label>Texto de macronutrientes</label>
          <textarea id="ctMacros"></textarea>
        </div>
        <div class="form-field">
          <label>Texto de "por qué es el mejor snack"</label>
          <textarea id="ctWhyBest"></textarea>
        </div>
        <div class="form-field">
          <label>Texto arriba de los productos</label>
          <textarea id="ctProductsIntro"></textarea>
        </div>
        <div class="form-field">
          <label>Aviso de las 72hs (el recuadro destacado)</label>
          <textarea id="ctLeadNotice"></textarea>
        </div>
        <button class="add-btn-main" id="saveTextsBtn">Guardar textos</button>
      </div>

      <div class="content-section">
        <h3>Contacto</h3>
        <div class="form-field">
          <label>Número de WhatsApp (con código de país, sin espacios ni +)</label>
          <input type="text" id="ctWhatsapp" placeholder="Ej: 59894310693">
        </div>
        <div class="form-field">
          <label>Usuario de Instagram (sin @)</label>
          <input type="text" id="ctInstagram" placeholder="Ej: uruguayanjerky">
        </div>
        <button class="add-btn-main" id="saveContactBtn">Guardar contacto</button>
      </div>

      <div class="content-section">
        <h3>Datos para transferencia bancaria</h3>
        <div class="form-field">
          <label>Plataforma</label>
          <input type="text" id="ctBankPlataforma">
        </div>
        <div class="form-field">
          <label>Titular</label>
          <input type="text" id="ctBankTitular">
        </div>
        <div class="form-field">
          <label>N° de cuenta</label>
          <input type="text" id="ctBankNumero">
        </div>
        <button class="add-btn-main" id="saveBankBtn">Guardar datos bancarios</button>
      </div>

      <div class="content-section">
        <h3>Preguntas frecuentes</h3>
        <button class="add-btn-main" id="addFaqBtn">+ Agregar pregunta</button>
        <div id="faqAdminList"></div>
      </div>

      <div class="content-section">
        <h3>Zonas de envío</h3>
        <button class="add-btn-main" id="addZoneBtn">+ Agregar zona</button>
        <div id="zoneAdminList"></div>
      </div>
    </div>
  </div>
</div>

<!-- Modal: producto -->
<div class="modal-overlay" id="productModal">
  <div class="modal-box">
    <h2 id="productModalTitle">Agregar producto</h2>
    <input type="hidden" id="prodId">
    <div class="form-field">
      <label>Nombre</label>
      <input type="text" id="prodName" placeholder="Ej: Yogur natural 200ml">
    </div>
    <div class="form-field">
      <label>Etiqueta (se muestra arriba del nombre)</label>
      <input type="text" id="prodKicker" placeholder="Ej: Más pedido · 100 g">
    </div>
    <div class="form-field">
      <label>Descripción corta</label>
      <textarea id="prodDesc" placeholder="Ej: Cremoso, sin azúcar agregada."></textarea>
    </div>
    <div class="form-field">
      <label>Precio ($U)</label>
      <input type="number" id="prodPrice" placeholder="Ej: 380">
    </div>
    <div class="form-field">
      <label>Dato destacado (opcional — ej: "≈ 49 g de proteína")</label>
      <input type="text" id="prodBadge" placeholder="Opcional">
    </div>
    <div class="form-field">
      <label>Foto del producto</label>
      <input type="file" id="prodImageFile" accept="image/*">
      <img id="prodImagePreview" class="img-preview">
    </div>
    <div class="form-actions">
      <button class="btn-cancel" id="cancelProductBtn">Cancelar</button>
      <button class="btn-save" id="saveProductBtn">Guardar</button>
    </div>
  </div>
</div>

<!-- Modal: código de descuento -->
<div class="modal-overlay" id="discountModal">
  <div class="modal-box">
    <h2 id="discountModalTitle">Agregar código</h2>
    <input type="hidden" id="discOriginalCode">
    <div class="form-field">
      <label>Código (lo escribe el cliente)</label>
      <input type="text" id="discCode" placeholder="Ej: BIENVENIDA" style="text-transform:uppercase;">
    </div>
    <div class="form-field">
      <label>Porcentaje de descuento</label>
      <input type="number" id="discPercent" placeholder="Ej: 10">
    </div>
    <div class="form-field checkbox">
      <input type="checkbox" id="discFreeShipping">
      <label style="margin:0;">También incluye envío gratis</label>
    </div>
    <div class="form-field">
      <label>Descripción (se le muestra al cliente)</label>
      <input type="text" id="discLabel" placeholder="Ej: 10% off + envío gratis por tu primera compra">
    </div>
    <div class="form-actions">
      <button class="btn-cancel" id="cancelDiscountBtn">Cancelar</button>
      <button class="btn-save" id="saveDiscountBtn">Guardar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Modal: pregunta frecuente -->
<div class="modal-overlay" id="faqModal">
  <div class="modal-box">
    <h2 id="faqModalTitle">Agregar pregunta</h2>
    <input type="hidden" id="faqIndex">
    <div class="form-field">
      <label>Pregunta</label>
      <input type="text" id="faqQuestion" placeholder="Ej: ¿Cómo se conserva el jerky?">
    </div>
    <div class="form-field">
      <label>Respuesta</label>
      <textarea id="faqAnswer" placeholder="Escribí la respuesta"></textarea>
    </div>
    <div class="form-actions">
      <button class="btn-cancel" id="cancelFaqBtn">Cancelar</button>
      <button class="btn-save" id="saveFaqBtn">Guardar</button>
    </div>
  </div>
</div>

<!-- Modal: zona de envío -->
<div class="modal-overlay" id="zoneModal">
  <div class="modal-box">
    <h2 id="zoneModalTitle">Agregar zona</h2>
    <input type="hidden" id="zoneOriginalKey">
    <div class="form-field">
      <label>Nombre de la zona</label>
      <input type="text" id="zoneLabel" placeholder="Ej: Zona 1">
    </div>
    <div class="form-field">
      <label>Costo de envío ($U)</label>
      <input type="number" id="zoneCost" placeholder="Ej: 180">
    </div>
    <div class="form-field">
      <label>Envío gratis a partir de ($U)</label>
      <input type="number" id="zoneFreeFrom" placeholder="Ej: 1000">
    </div>
    <div class="form-field">
      <label>Barrios (separados por coma)</label>
      <textarea id="zoneNeighborhoods" placeholder="Ej: Pocitos, Punta Carretas, Centro"></textarea>
    </div>
    <div class="form-actions">
      <button class="btn-cancel" id="cancelZoneBtn">Cancelar</button>
      <button class="btn-save" id="saveZoneBtn">Guardar</button>
    </div>
  </div>
</div>

<script>
let ADMIN_PASSWORD_CACHE = '';
let products = [];
let discounts = {};
let editingProductId = null;
let editingDiscountCode = null;
let pendingImageDataUrl = null;

function showToast(msg, isError){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = isError ? '#b04a4a' : 'var(--gold)';
  t.style.color = isError ? '#fff' : 'var(--wood)';
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2600);
}

async function apiFetch(path, options={}){
  const headers = Object.assign({}, options.headers || {}, { 'X-Admin-Password': ADMIN_PASSWORD_CACHE });
  return fetch(path, Object.assign({}, options, { headers }));
}

// ---- LOGIN ----
document.getElementById('loginBtn').addEventListener('click', async ()=>{
  const pass = document.getElementById('passwordInput').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  try{
    const res = await fetch('/.netlify/functions/admin-check', {
      headers: { 'X-Admin-Password': pass }
    });
    if(!res.ok){
      const data = await res.json().catch(()=>({}));
      errEl.textContent = data.error || 'Contraseña incorrecta.';
      return;
    }
    ADMIN_PASSWORD_CACHE = pass;
    sessionStorage.setItem('jerky_admin_pw', pass);
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadAll();
  } catch(err){
    errEl.textContent = 'No se pudo conectar. ¿Está desplegado el sitio en Netlify?';
  }
});

document.getElementById('passwordInput').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') document.getElementById('loginBtn').click();
});

document.getElementById('logoutBtn').addEventListener('click', ()=>{
  sessionStorage.removeItem('jerky_admin_pw');
  location.reload();
});

// intenta retomar sesión guardada en esta pestaña
(function tryResume(){
  const saved = sessionStorage.getItem('jerky_admin_pw');
  if(saved){
    ADMIN_PASSWORD_CACHE = saved;
    fetch('/.netlify/functions/admin-check', { headers:{ 'X-Admin-Password': saved } })
      .then(res=>{
        if(res.ok){
          document.getElementById('loginScreen').style.display = 'none';
          document.getElementById('dashboard').style.display = 'block';
          loadAll();
        }
      });
  }
})();

// ---- TABS ----
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

// ---- LOAD DATA ----
let siteContent = {};
let reviews = [];

async function loadAll(){
  try{
    const [pRes, dRes, cRes, rRes] = await Promise.all([
      fetch('/.netlify/functions/products-get'),
      fetch('/.netlify/functions/discounts-get'),
      fetch('/.netlify/functions/site-content-get'),
      fetch('/.netlify/functions/reviews-get')
    ]);
    products = await pRes.json();
    discounts = await dRes.json();
    siteContent = await cRes.json();
    reviews = await rRes.json();
    renderProductList();
    renderDiscountList();
    fillContentForm();
    renderFaqAdminList();
    renderZoneAdminList();
    renderReviewsAdminList();
  } catch(err){
    showToast('No se pudieron cargar los datos', true);
  }
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderReviewsAdminList(){
  const el = document.getElementById('reviewsAdminList');
  if(reviews.length === 0){
    el.innerHTML = '<div class="empty-state">Todavía no hay reseñas de clientes.</div>';
    return;
  }
  el.innerHTML = reviews.map(r => {
    const stars = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
    const date = new Date(r.date).toLocaleDateString('es-UY');
    return `
      <div class="item-card">
        <div class="info">
          <div class="name">${escapeHtml(r.name)} — <span style="color:var(--gold);">${stars}</span></div>
          <div class="meta">${date} · ${escapeHtml(r.comment)}</div>
        </div>
        <div class="actions">
          <button class="btn-delete" data-id="${r.id}">Eliminar</button>
        </div>
      </div>
    `;
  }).join('');
  el.querySelectorAll('.btn-delete').forEach(b=>b.addEventListener('click', ()=>deleteReview(b.dataset.id)));
}

async function deleteReview(id){
  if(!confirm('¿Eliminar esta reseña?')) return;
  try{
    const res = await apiFetch('/.netlify/functions/reviews-delete', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ id })
    });
    if(!res.ok) throw new Error();
    reviews = reviews.filter(r => r.id !== id);
    renderReviewsAdminList();
    showToast('Reseña eliminada');
  } catch(err){
    showToast('No se pudo eliminar', true);
  }
}

function fillContentForm(){
  document.getElementById('ctHeroLead').value = siteContent.heroLead || '';
  document.getElementById('ctNutritionTitle').value = siteContent.nutritionTitle || '';
  document.getElementById('ctMacros').value = siteContent.macrosText || '';
  document.getElementById('ctWhyBest').value = siteContent.whyBestText || '';
  document.getElementById('ctProductsIntro').value = siteContent.productsIntro || '';
  document.getElementById('ctLeadNotice').value = siteContent.leadNotice || '';
  document.getElementById('ctWhatsapp').value = siteContent.whatsappNumber || '';
  document.getElementById('ctInstagram').value = siteContent.instagramHandle || '';
  const bank = siteContent.bankInfo || {};
  document.getElementById('ctBankPlataforma').value = bank.plataforma || '';
  document.getElementById('ctBankTitular').value = bank.titular || '';
  document.getElementById('ctBankNumero').value = bank.numero || '';
}

async function saveSiteContent(successMsg){
  try{
    const res = await apiFetch('/.netlify/functions/site-content-save', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(siteContent)
    });
    if(!res.ok) throw new Error('No se pudo guardar');
    showToast(successMsg || 'Guardado ✓');
  } catch(err){
    showToast(err.message || 'Error al guardar', true);
  }
}

document.getElementById('saveTextsBtn').addEventListener('click', ()=>{
  siteContent.heroLead = document.getElementById('ctHeroLead').value.trim();
  siteContent.nutritionTitle = document.getElementById('ctNutritionTitle').value.trim();
  siteContent.macrosText = document.getElementById('ctMacros').value.trim();
  siteContent.whyBestText = document.getElementById('ctWhyBest').value.trim();
  siteContent.productsIntro = document.getElementById('ctProductsIntro').value.trim();
  siteContent.leadNotice = document.getElementById('ctLeadNotice').value.trim();
  saveSiteContent('Textos guardados ✓');
});

document.getElementById('saveContactBtn').addEventListener('click', ()=>{
  siteContent.whatsappNumber = document.getElementById('ctWhatsapp').value.trim();
  siteContent.instagramHandle = document.getElementById('ctInstagram').value.trim();
  saveSiteContent('Contacto guardado ✓');
});

document.getElementById('saveBankBtn').addEventListener('click', ()=>{
  siteContent.bankInfo = {
    plataforma: document.getElementById('ctBankPlataforma').value.trim(),
    titular: document.getElementById('ctBankTitular').value.trim(),
    numero: document.getElementById('ctBankNumero').value.trim()
  };
  saveSiteContent('Datos bancarios guardados ✓');
});

// ---- FAQ ----
function renderFaqAdminList(){
  const el = document.getElementById('faqAdminList');
  const faq = siteContent.faq || [];
  if(faq.length === 0){
    el.innerHTML = '<div class="empty-state">Todavía no hay preguntas cargadas.</div>';
    return;
  }
  el.innerHTML = faq.map((item, i) => `
    <div class="item-card">
      <div class="info">
        <div class="name">${item.q}</div>
        <div class="meta">${item.a}</div>
      </div>
      <div class="actions">
        <button class="btn-edit" data-i="${i}">Editar</button>
        <button class="btn-delete" data-i="${i}">Eliminar</button>
      </div>
    </div>
  `).join('');
  el.querySelectorAll('.btn-edit').forEach(b=>b.addEventListener('click', ()=>openFaqModal(parseInt(b.dataset.i))));
  el.querySelectorAll('.btn-delete').forEach(b=>b.addEventListener('click', ()=>deleteFaq(parseInt(b.dataset.i))));
}

function openFaqModal(index){
  const isEdit = index !== null && index !== undefined;
  document.getElementById('faqModalTitle').textContent = isEdit ? 'Editar pregunta' : 'Agregar pregunta';
  document.getElementById('faqIndex').value = isEdit ? index : '';
  const item = isEdit ? siteContent.faq[index] : null;
  document.getElementById('faqQuestion').value = item ? item.q : '';
  document.getElementById('faqAnswer').value = item ? item.a : '';
  document.getElementById('faqModal').classList.add('open');
}

document.getElementById('addFaqBtn').addEventListener('click', ()=>openFaqModal(null));
document.getElementById('cancelFaqBtn').addEventListener('click', ()=>{
  document.getElementById('faqModal').classList.remove('open');
});

document.getElementById('saveFaqBtn').addEventListener('click', async ()=>{
  const q = document.getElementById('faqQuestion').value.trim();
  const a = document.getElementById('faqAnswer').value.trim();
  if(!q || !a){ showToast('Completá la pregunta y la respuesta', true); return; }
  const idxStr = document.getElementById('faqIndex').value;
  if(!siteContent.faq) siteContent.faq = [];
  if(idxStr !== ''){
    siteContent.faq[parseInt(idxStr)] = { q, a };
  } else {
    siteContent.faq.push({ q, a });
  }
  await saveSiteContent('Pregunta guardada ✓');
  document.getElementById('faqModal').classList.remove('open');
  renderFaqAdminList();
});

async function deleteFaq(index){
  if(!confirm('¿Eliminar esta pregunta?')) return;
  siteContent.faq.splice(index, 1);
  await saveSiteContent('Pregunta eliminada');
  renderFaqAdminList();
}

// ---- ZONAS DE ENVÍO ----
function renderZoneAdminList(){
  const el = document.getElementById('zoneAdminList');
  const zones = siteContent.shippingZones || [];
  if(zones.length === 0){
    el.innerHTML = '<div class="empty-state">Todavía no hay zonas cargadas.</div>';
    return;
  }
  el.innerHTML = zones.map((z, i) => `
    <div class="item-card">
      <div class="info">
        <div class="name">${z.label} — $U ${z.cost} (gratis desde $U ${z.freeFrom})</div>
        <div class="meta">${(z.neighborhoods||[]).join(', ')}</div>
      </div>
      <div class="actions">
        <button class="btn-edit" data-i="${i}">Editar</button>
        <button class="btn-delete" data-i="${i}">Eliminar</button>
      </div>
    </div>
  `).join('');
  el.querySelectorAll('.btn-edit').forEach(b=>b.addEventListener('click', ()=>openZoneModal(parseInt(b.dataset.i))));
  el.querySelectorAll('.btn-delete').forEach(b=>b.addEventListener('click', ()=>deleteZone(parseInt(b.dataset.i))));
}

function openZoneModal(index){
  const isEdit = index !== null && index !== undefined;
  document.getElementById('zoneModalTitle').textContent = isEdit ? 'Editar zona' : 'Agregar zona';
  document.getElementById('zoneOriginalKey').value = isEdit ? index : '';
  const z = isEdit ? siteContent.shippingZones[index] : null;
  document.getElementById('zoneLabel').value = z ? z.label : '';
  document.getElementById('zoneCost').value = z ? z.cost : '';
  document.getElementById('zoneFreeFrom').value = z ? z.freeFrom : '';
  document.getElementById('zoneNeighborhoods').value = z ? (z.neighborhoods||[]).join(', ') : '';
  document.getElementById('zoneModal').classList.add('open');
}

document.getElementById('addZoneBtn').addEventListener('click', ()=>openZoneModal(null));
document.getElementById('cancelZoneBtn').addEventListener('click', ()=>{
  document.getElementById('zoneModal').classList.remove('open');
});

function slugifyZone(text){
  return text.toString().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'zona';
}

document.getElementById('saveZoneBtn').addEventListener('click', async ()=>{
  const label = document.getElementById('zoneLabel').value.trim();
  const cost = parseFloat(document.getElementById('zoneCost').value);
  const freeFrom = parseFloat(document.getElementById('zoneFreeFrom').value);
  const neighborhoods = document.getElementById('zoneNeighborhoods').value.split(',').map(s=>s.trim()).filter(Boolean);
  if(!label || isNaN(cost) || isNaN(freeFrom) || neighborhoods.length===0){
    showToast('Completá todos los campos', true);
    return;
  }
  const idxStr = document.getElementById('zoneOriginalKey').value;
  if(!siteContent.shippingZones) siteContent.shippingZones = [];
  const existing = idxStr !== '' ? siteContent.shippingZones[parseInt(idxStr)] : null;
  const key = existing ? existing.key : slugifyZone(label) + '-' + Date.now().toString(36);
  const newZone = { key, label, cost, freeFrom, neighborhoods };
  if(idxStr !== ''){
    siteContent.shippingZones[parseInt(idxStr)] = newZone;
  } else {
    siteContent.shippingZones.push(newZone);
  }
  await saveSiteContent('Zona guardada ✓');
  document.getElementById('zoneModal').classList.remove('open');
  renderZoneAdminList();
});

async function deleteZone(index){
  if(!confirm('¿Eliminar esta zona?')) return;
  siteContent.shippingZones.splice(index, 1);
  await saveSiteContent('Zona eliminada');
  renderZoneAdminList();
}

function renderProductList(){
  const el = document.getElementById('productList');
  if(products.length === 0){
    el.innerHTML = '<div class="empty-state">Todavía no cargaste ningún producto.</div>';
    return;
  }
  el.innerHTML = products.map(p => `
    <div class="item-card">
      <img src="${p.img || ''}" alt="${p.name}" onerror="this.style.opacity=0">
      <div class="info">
        <div class="name">${p.name}</div>
        <div class="meta">${p.kicker || ''} · $U ${p.price}</div>
      </div>
      <div class="actions">
        <button class="btn-edit" data-id="${p.id}">Editar</button>
        <button class="btn-delete" data-id="${p.id}">Eliminar</button>
      </div>
    </div>
  `).join('');
  el.querySelectorAll('.btn-edit').forEach(b=>b.addEventListener('click', ()=>openProductModal(b.dataset.id)));
  el.querySelectorAll('.btn-delete').forEach(b=>b.addEventListener('click', ()=>deleteProduct(b.dataset.id)));
}

function renderDiscountList(){
  const el = document.getElementById('discountList');
  const codes = Object.keys(discounts);
  if(codes.length === 0){
    el.innerHTML = '<div class="empty-state">Todavía no cargaste ningún código.</div>';
    return;
  }
  el.innerHTML = codes.map(code => {
    const d = discounts[code];
    return `
      <div class="item-card">
        <div class="info">
          <div class="name">${code}</div>
          <div class="meta">${d.percent}% off${d.freeShipping ? ' + envío gratis' : ''} — ${d.label || ''}</div>
        </div>
        <div class="actions">
          <button class="btn-edit" data-code="${code}">Editar</button>
          <button class="btn-delete" data-code="${code}">Eliminar</button>
        </div>
      </div>
    `;
  }).join('');
  el.querySelectorAll('.btn-edit').forEach(b=>b.addEventListener('click', ()=>openDiscountModal(b.dataset.code)));
  el.querySelectorAll('.btn-delete').forEach(b=>b.addEventListener('click', ()=>deleteDiscount(b.dataset.code)));
}

// ---- PRODUCT MODAL ----
function openProductModal(id){
  editingProductId = id || null;
  pendingImageDataUrl = null;
  const p = id ? products.find(x=>x.id===id) : null;
  document.getElementById('productModalTitle').textContent = id ? 'Editar producto' : 'Agregar producto';
  document.getElementById('prodId').value = id || '';
  document.getElementById('prodName').value = p ? p.name : '';
  document.getElementById('prodKicker').value = p ? (p.kicker||'') : '';
  document.getElementById('prodDesc').value = p ? (p.desc||'') : '';
  document.getElementById('prodPrice').value = p ? p.price : '';
  document.getElementById('prodBadge').value = p ? (p.badge||'') : '';
  document.getElementById('prodImageFile').value = '';
  const preview = document.getElementById('prodImagePreview');
  if(p && p.img){ preview.src = p.img; preview.style.display = 'block'; }
  else { preview.style.display = 'none'; }
  document.getElementById('productModal').classList.add('open');
}

document.getElementById('addProductBtn').addEventListener('click', ()=>openProductModal(null));
document.getElementById('cancelProductBtn').addEventListener('click', ()=>{
  document.getElementById('productModal').classList.remove('open');
});

document.getElementById('prodImageFile').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    pendingImageDataUrl = reader.result;
    const preview = document.getElementById('prodImagePreview');
    preview.src = pendingImageDataUrl;
    preview.style.display = 'block';
  };
  reader.readAsDataURL(file);
});

function slugify(text){
  return text.toString().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'producto';
}

document.getElementById('saveProductBtn').addEventListener('click', async ()=>{
  const name = document.getElementById('prodName').value.trim();
  const price = parseFloat(document.getElementById('prodPrice').value);
  if(!name || isNaN(price)){
    showToast('Completá al menos el nombre y el precio', true);
    return;
  }
  const btn = document.getElementById('saveProductBtn');
  btn.disabled = true; btn.textContent = 'Guardando...';

  let id = editingProductId || (slugify(name) + '-' + Date.now().toString(36));
  let imgUrl = null;
  const existing = products.find(x=>x.id===editingProductId);
  if(existing) imgUrl = existing.img;

  try{
    if(pendingImageDataUrl){
      const upRes = await apiFetch('/.netlify/functions/image-upload', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ id, dataUrl: pendingImageDataUrl })
      });
      if(!upRes.ok) throw new Error('No se pudo subir la imagen');
      const upData = await upRes.json();
      imgUrl = upData.url;
    }

    const newProduct = {
      id,
      name,
      kicker: document.getElementById('prodKicker').value.trim(),
      desc: document.getElementById('prodDesc').value.trim(),
      price,
      badge: document.getElementById('prodBadge').value.trim(),
      img: imgUrl || ''
    };

    if(editingProductId){
      products = products.map(p => p.id === editingProductId ? newProduct : p);
    } else {
      products.push(newProduct);
    }

    const saveRes = await apiFetch('/.netlify/functions/products-save', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(products)
    });
    if(!saveRes.ok) throw new Error('No se pudo guardar');

    document.getElementById('productModal').classList.remove('open');
    renderProductList();
    showToast('Producto guardado ✓');
  } catch(err){
    showToast(err.message || 'Error al guardar', true);
  } finally {
    btn.disabled = false; btn.textContent = 'Guardar';
  }
});

async function deleteProduct(id){
  if(!confirm('¿Eliminar este producto?')) return;
  products = products.filter(p => p.id !== id);
  try{
    const res = await apiFetch('/.netlify/functions/products-save', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(products)
    });
    if(!res.ok) throw new Error();
    renderProductList();
    showToast('Producto eliminado');
  } catch(err){
    showToast('No se pudo eliminar', true);
  }
}

// ---- DISCOUNT MODAL ----
function openDiscountModal(code){
  editingDiscountCode = code || null;
  const d = code ? discounts[code] : null;
  document.getElementById('discountModalTitle').textContent = code ? 'Editar código' : 'Agregar código';
  document.getElementById('discOriginalCode').value = code || '';
  document.getElementById('discCode').value = code || '';
  document.getElementById('discPercent').value = d ? d.percent : '';
  document.getElementById('discFreeShipping').checked = d ? !!d.freeShipping : false;
  document.getElementById('discLabel').value = d ? (d.label||'') : '';
  document.getElementById('discountModal').classList.add('open');
}

document.getElementById('addDiscountBtn').addEventListener('click', ()=>openDiscountModal(null));
document.getElementById('cancelDiscountBtn').addEventListener('click', ()=>{
  document.getElementById('discountModal').classList.remove('open');
});

document.getElementById('saveDiscountBtn').addEventListener('click', async ()=>{
  const code = document.getElementById('discCode').value.trim().toUpperCase();
  const percent = parseFloat(document.getElementById('discPercent').value);
  if(!code || isNaN(percent)){
    showToast('Completá el código y el porcentaje', true);
    return;
  }
  const btn = document.getElementById('saveDiscountBtn');
  btn.disabled = true; btn.textContent = 'Guardando...';

  try{
    if(editingDiscountCode && editingDiscountCode !== code){
      delete discounts[editingDiscountCode];
    }
    discounts[code] = {
      percent,
      freeShipping: document.getElementById('discFreeShipping').checked,
      label: document.getElementById('discLabel').value.trim()
    };

    const res = await apiFetch('/.netlify/functions/discounts-save', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(discounts)
    });
    if(!res.ok) throw new Error('No se pudo guardar');

    document.getElementById('discountModal').classList.remove('open');
    renderDiscountList();
    showToast('Código guardado ✓');
  } catch(err){
    showToast(err.message || 'Error al guardar', true);
  } finally {
    btn.disabled = false; btn.textContent = 'Guardar';
  }
});

async function deleteDiscount(code){
  if(!confirm('¿Eliminar este código?')) return;
  delete discounts[code];
  try{
    const res = await apiFetch('/.netlify/functions/discounts-save', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(discounts)
    });
    if(!res.ok) throw new Error();
    renderDiscountList();
    showToast('Código eliminado');
  } catch(err){
    showToast('No se pudo eliminar', true);
  }
}
</script>
